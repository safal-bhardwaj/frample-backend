

spring.application.name=frample-backend


#db configs-----
 
spring.datasource.url=jdbc:mysql://localhost:3306/frample_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema generation strategy
spring.jpa.hibernate.ddl-auto=update

# SQL Logging (Correct Spring Boot properties)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Turn off the open-in-view warning from your log
spring.jpa.open-in-view=false


# Security & JWT Properties
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=frample-backend
security.jwt.access-ttl-seconds=3600
security.jwt.refresh-ttl-seconds=604800

#Cookies
security.cookie.secure=false

#Oauth Google
security.oauth.google.client-id=${GOOGLE_CLIENT_ID}

#Storage
security.r2.endpoint=${R2_ENDPOINT}
security.r2.bucket=${R2_BUCKET}
security.r2.access-key=${R2_ACCESSKEY}
security.r2.secret-key=${R2_SECRETKEY}